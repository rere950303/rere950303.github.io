<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f6feb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2da44e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#cf222e"/></marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0B1F3A">AI 순환 금융의 핵심 고리 (2026년 11월 기준)</text>

  <!-- nodes -->
  <rect x="290" y="60" width="180" height="64" rx="12" fill="#76b900"/>
  <text x="380" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">엔비디아</text>
  <text x="380" y="111" text-anchor="middle" font-size="12" fill="#fff">GPU 판매 + 투자 + 보증</text>

  <rect x="40" y="300" width="180" height="64" rx="12" fill="#0B1F3A"/>
  <text x="130" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">OpenAI</text>
  <text x="130" y="351" text-anchor="middle" font-size="12" fill="#fff">연 매출 약 400~700억 달러</text>

  <rect x="540" y="300" width="180" height="64" rx="12" fill="#c74634"/>
  <text x="630" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">오라클 · CoreWeave</text>
  <text x="630" y="351" text-anchor="middle" font-size="12" fill="#fff">데이터센터(클라우드)</text>

  <rect x="290" y="440" width="180" height="56" rx="12" fill="#6e7781"/>
  <text x="380" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">은행 · 채권시장</text>
  <text x="380" y="485" text-anchor="middle" font-size="12" fill="#fff">빚으로 건설 자금 공급</text>

  <!-- Nvidia -> OpenAI -->
  <path d="M290,110 Q150,150 130,295" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#a)"/>
  <text x="20" y="160" font-size="13" fill="#1f6feb" font-weight="700">① 지분 투자 300억$</text>
  <text x="20" y="178" font-size="13" fill="#1f6feb" font-weight="700">+ 보증 최대 1,050억$</text>

  <!-- OpenAI -> Oracle -->
  <path d="M220,332 L535,332" fill="none" stroke="#2da44e" stroke-width="3" marker-end="url(#g)"/>
  <text x="378" y="320" text-anchor="middle" font-size="13" fill="#2da44e" font-weight="700">② 컴퓨팅 사용 계약 (오라클 약 3,000억$)</text>

  <!-- Oracle -> Nvidia -->
  <path d="M630,295 Q610,150 470,110" fill="none" stroke="#cf222e" stroke-width="3" marker-end="url(#r)"/>
  <text x="560" y="170" font-size="13" fill="#cf222e" font-weight="700">③ GPU 구매</text>
  <text x="560" y="188" font-size="13" fill="#cf222e" font-weight="700">  = 엔비디아 매출</text>

  <!-- Nvidia -> CoreWeave backstop -->
  <path d="M470,85 Q700,80 700,295" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="745" y="58" text-anchor="end" font-size="12" fill="#1f6feb">지분 약 20억$ + 안 팔린 용량 63억$ 매입 약속</text>

  <!-- Banks -> Oracle -->
  <path d="M470,468 Q620,460 630,370" fill="none" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="515" y="440" font-size="12" fill="#57606a">대출·회사채</text>

  <text x="380" y="215" text-anchor="middle" font-size="14" fill="#57606a">엔비디아가 넣은 돈이</text>
  <text x="380" y="235" text-anchor="middle" font-size="14" fill="#57606a">한 바퀴 돌아 다시 엔비디아 매출로</text>
  <text x="380" y="262" text-anchor="middle" font-size="26" fill="#57606a">↻</text>
</svg>
