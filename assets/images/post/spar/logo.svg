<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A22"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#5B3DF5"/>
    </linearGradient>
    <clipPath id="leftBubble">
      <circle cx="206" cy="226" r="118"/>
      <path d="M118 300 L92 380 L178 330 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 내 말풍선 (라임) -->
  <circle cx="206" cy="226" r="118" fill="#C6FF3D"/>
  <path d="M118 300 L92 380 L178 330 Z" fill="#C6FF3D"/>
  <!-- 상대 말풍선 (바이올렛) -->
  <g>
    <circle cx="306" cy="286" r="118" fill="url(#violet)"/>
    <path d="M394 360 L420 440 L334 390 Z" fill="url(#violet)"/>
  </g>
  <!-- 두 입장이 겹치는 곳 = 대화가 붙는 지점 -->
  <g clip-path="url(#leftBubble)">
    <circle cx="306" cy="286" r="118" fill="#FFFFFF"/>
  </g>
</svg>
